[package]
name = "game"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
asset = { path = "../asset" }
protocol = { path = "../protocol" }
glam = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AbortController",
  "AbortSignal",
  "AudioBuffer",
  "AudioBufferSourceNode",
  "AudioContext",
  "AudioContextState",
  "AudioDestinationNode",
  "AudioNode",
  "AudioParam",
  "AudioScheduledSourceNode",
  "BaseAudioContext",
  "DynamicsCompressorNode",
  "GainNode",
  "StereoPannerNode",
  "console",
  "BinaryType",
  "Blob",
  "CanvasRenderingContext2d",
  "ImageData",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "HtmlElement",
  "HtmlInputElement",
  "Location",
  "MessageEvent",
  "Performance",
  "Storage",
  "WebSocket",
  "HtmlCanvasElement",
  "HtmlImageElement",
  "KeyboardEvent",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "RequestInit",
  "Response",
  "MouseEvent",
  "WheelEvent",
  "Url",
  "WebGl2RenderingContext",
  "WebGlBuffer",
  "WebGlProgram",
  "WebGlShader",
  "WebGlTexture",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
  "Window",
] }
